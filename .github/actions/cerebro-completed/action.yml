name: Blazium Cerebro Build (Completed)
description: Update the State

inputs:
  name:
    description: The artifact name.
    required: true
  run_id:
    description: ID for the Whole Run.
    required: true
  file_url:
    description: CDN File URL
    required: true
  version:
    description: Version of Project for File
    required: true
  checksum:
    description: SHA256 checksum of the uploaded artifact
    required: false
    default: ""
  artifact_path:
    description: Local path to compute sha256 when checksum is not provided
    required: false
    default: ""
  cerebro_url:
    description: The full URL to send the update.
    required: true
  cerebro_auth:
    description: Auth Key to Cerebro for Blazium.
    required: true

runs:
  using: "composite"
  steps:
    - name: Send Cerebro Update
      shell: bash
      run: |
        set -euo pipefail

        log_err() {
          echo "$1"
          echo "$1" >> "$GITHUB_STEP_SUMMARY"
        }

        CHECKSUM="${{ inputs.checksum }}"
        ARTIFACT="${{ inputs.artifact_path }}"
        if [ -z "$ARTIFACT" ]; then
          ARTIFACT="${GITHUB_WORKSPACE}/$(basename "${{ inputs.file_url }}")"
        fi
        # Git Bash cannot open mixed Windows paths (D:\a\.../file); normalize first.
        if command -v cygpath >/dev/null 2>&1; then
          ARTIFACT="$(cygpath -u "$ARTIFACT")"
        else
          ARTIFACT="${ARTIFACT//\\//}"
        fi
        if [ -z "$CHECKSUM" ]; then
          if [ ! -f "$ARTIFACT" ]; then
            log_err "Error: artifact not found for checksum: $ARTIFACT"
            exit 1
          fi
          # Prefer sha256sum (stable hex). openssl -r is not portable across OpenSSL builds
          # and has produced non-64-hex digests that fail validation (CI job failures).
          if command -v sha256sum >/dev/null 2>&1; then
            CHECKSUM=$(sha256sum "$ARTIFACT" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            CHECKSUM=$(shasum -a 256 "$ARTIFACT" | awk '{print $1}')
          elif command -v openssl >/dev/null 2>&1; then
            CHECKSUM=$(openssl dgst -sha256 "$ARTIFACT" | awk '{print $NF}')
          else
            log_err "Error: no sha256sum/shasum/openssl available to checksum $ARTIFACT"
            exit 1
          fi
        fi
        CHECKSUM=$(printf '%s' "$CHECKSUM" | tr -d '\r\n *' | tr '[:upper:]' '[:lower:]')
        if [ -z "$CHECKSUM" ] || ! echo "$CHECKSUM" | grep -Eq '^[a-f0-9]{64}$'; then
          log_err "Error: invalid checksum length/format: ${#CHECKSUM} chars (preview: ${CHECKSUM:0:80})"
          log_err "Artifact: $ARTIFACT ($(wc -c < "$ARTIFACT" | tr -d ' ') bytes)"
          exit 1
        fi

        BODY=$(jq -n \
          --arg file_url "${{ inputs.file_url }}" \
          --arg version "${{ inputs.version }}" \
          --arg checksum "$CHECKSUM" \
          '{
            file_url: $file_url,
            version: $version
          } + (if ($checksum | length) > 0 then {checksum: $checksum} else {} end)')

        should_retry_http() {
          local code="${1:-000}"
          case "$code" in
            000|408|429|500|502|503|504|520|521|522|523|524) return 0 ;;
          esac
          [ "$code" -ge 500 ] 2>/dev/null
        }

        MAX_ATTEMPTS=5
        SLEEP_SECS=2
        HTTP_CODE=""
        response=""
        curl_exit=0
        attempt=1
        while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
          RESP_FILE="${RUNNER_TEMP:-/tmp}/cerebro_completed_response.json"
          set +e
          HTTP_CODE=$(curl -sS --retry 0 --connect-timeout 15 --max-time 30 \
            -o "$RESP_FILE" -w "%{http_code}" \
            -X POST "${{ inputs.cerebro_url }}/api/v1/enginebuilds/${{ inputs.run_id }}/completed/${{ inputs.name }}" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ inputs.cerebro_auth }}" \
            -d "$BODY")
          curl_exit=$?
          set -e
          if [ -z "$HTTP_CODE" ]; then
            HTTP_CODE=000
          fi
          response=$(cat "$RESP_FILE" 2>/dev/null || true)
          echo "Attempt $attempt/$MAX_ATTEMPTS HTTP $HTTP_CODE curl_exit=$curl_exit"
          echo "Response: $response"

          if [ "$curl_exit" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            if echo "$response" | jq -e '.success == true' >/dev/null 2>&1; then
              break
            fi
          fi

          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            break
          fi
          if [ "$curl_exit" -ne 0 ] || should_retry_http "$HTTP_CODE"; then
            echo "Retrying Cerebro completed notify in ${SLEEP_SECS}s..."
            sleep "$SLEEP_SECS"
            SLEEP_SECS=$((SLEEP_SECS * 2))
            attempt=$((attempt + 1))
            continue
          fi
          break
        done

        echo "## Build (Completed)" >> "$GITHUB_STEP_SUMMARY"
        echo "Artifact: $ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
        echo "Checksum length: ${#CHECKSUM}" >> "$GITHUB_STEP_SUMMARY"
        echo "HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
        echo "Response: $response" >> "$GITHUB_STEP_SUMMARY"
        echo "Artifact: $ARTIFACT"
        echo "Checksum length: ${#CHECKSUM}"
        echo "HTTP $HTTP_CODE"
        echo "Response: $response"

        if [ "$curl_exit" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          log_err "Error: Cerebro update failed with HTTP $HTTP_CODE."
          exit 1
        fi

        if ! echo "$response" | jq -e '.success == true' >/dev/null 2>&1; then
          log_err "Error: Cerebro update failed."
          exit 1
        fi

        echo "Cerebro update was successful."
        echo "Cerebro update was successful." >> "$GITHUB_STEP_SUMMARY"
