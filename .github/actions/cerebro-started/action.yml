name: Blazium Cerebro Build (Started)
description: Update the State

inputs:
  name:
    description: The artifact name.
    required: true
  run_id:
    description: ID for the Whole Run.
    required: true
  build_type:
    description: Template or Editor build type.
    required: true
  mono:
    description: Whether Mono is enabled (true/false).
    required: true
  deploy_type:
    description: The type of deployment (nightly, prerelease, release).
    required: true
  branch:
    description: The branch name.
    required: true
  build_os:
    description: The operating system for the build (e.g., Windows).
    required: true
  file_url:
    description: The URL of the file.
    required: false
  checksum:
    description: The SHA-256 checksum of the file.
    required: true
  arch:
    description: Target architecture (e.g. x86_64, arm64, wasm32).
    required: false
    default: ""
  production:
    description: Whether the build is for production (true/false).
    required: true
  version:
    description: The version of the build.
    required: false
  cerebro_url:
    description: The full URL to send the update.
    required: true
  cerebro_auth:
    description: Auth Key to Cerebro for Blazium.
    required: true

runs:
  using: "composite"
  steps:
    - name: Send Cerebro Update
      shell: bash
      run: |
        set -euo pipefail

        BODY=$(jq -n \
          --arg name "${{ inputs.name }}" \
          --arg run_id "${{ inputs.run_id }}" \
          --arg build_type "${{ inputs.build_type }}" \
          --argjson mono ${{ inputs.mono }} \
          --arg deploy_type "${{ inputs.deploy_type }}" \
          --arg branch "${{ inputs.branch }}" \
          --arg build_os "${{ inputs.build_os }}" \
          --arg checksum "${{ inputs.checksum }}" \
          --arg arch "${{ inputs.arch }}" \
          --arg version "${{ inputs.version }}" \
          --argjson production ${{ inputs.production }} \
          '{
            name: $name,
            run_id: $run_id,
            build_type: $build_type,
            mono: $mono,
            deploy_type: $deploy_type,
            branch: $branch,
            build_os: $build_os,
            checksum: $checksum,
            production: $production
          }
          + (if ($arch | length) > 0 then {arch: $arch} else {} end)
          + (if ($version | length) > 0 then {version: $version} else {} end)')

        HTTP_CODE=$(curl -sS -o /tmp/cerebro_started_response.json -w "%{http_code}" \
          -X POST "${{ inputs.cerebro_url }}/api/v1/enginebuilds" \
          -H "Content-Type: application/json" \
          -H "BLAZIUM_AUTH: ${{ inputs.cerebro_auth }}" \
          -d "$BODY")

        response=$(cat /tmp/cerebro_started_response.json)
        echo "## Build (Started)" >> "$GITHUB_STEP_SUMMARY"
        echo "HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
        echo "Response: $response" >> "$GITHUB_STEP_SUMMARY"

        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          echo "Error: Cerebro update failed with HTTP $HTTP_CODE." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        if ! echo "$response" | jq -e '.success == true' >/dev/null 2>&1; then
          echo "Error: Cerebro update failed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "Cerebro update was successful." >> "$GITHUB_STEP_SUMMARY"
