name: Blazium Cerebro Build (Started)
description: Update the State

inputs:
  name:
    description: The artifact name.
    required: true
  run_id:
    description: ID for the Whole Run.
    required: true
  build_type:
    description: Template or Editor build type.
    required: true
  mono:
    description: Whether Mono is enabled (true/false).
    required: true
  deploy_type:
    description: The type of deployment (nightly, prerelease, release).
    required: true
  branch:
    description: The branch name.
    required: true
  build_os:
    description: The operating system for the build (e.g., Windows).
    required: true
  file_url:
    description: The URL of the file.
    required: false
  checksum:
    description: The SHA-256 checksum of the file.
    required: true
  arch:
    description: Target architecture (e.g. x86_64, arm64, wasm32).
    required: false
    default: ""
  production:
    description: Whether the build is for production (true/false).
    required: true
  version:
    description: The version of the build.
    required: false
  build_sha:
    description: Git commit SHA for this artifact. Defaults to checksum when that value is a git SHA.
    required: false
    default: ""
  cerebro_url:
    description: The full URL to send the update.
    required: true
  cerebro_auth:
    description: Auth Key to Cerebro for Blazium.
    required: true

runs:
  using: "composite"
  steps:
    - name: Send Cerebro Update
      shell: bash
      run: |
        set -euo pipefail

        log_err() {
          echo "$1"
          echo "$1" >> "$GITHUB_STEP_SUMMARY"
        }

        BUILD_SHA="${{ inputs.build_sha }}"
        if [ -z "$BUILD_SHA" ]; then
          BUILD_SHA="${{ inputs.checksum }}"
        fi

        BODY=$(jq -n \
          --arg name "${{ inputs.name }}" \
          --arg run_id "${{ inputs.run_id }}" \
          --arg build_type "${{ inputs.build_type }}" \
          --argjson mono ${{ inputs.mono }} \
          --arg deploy_type "${{ inputs.deploy_type }}" \
          --arg branch "${{ inputs.branch }}" \
          --arg build_os "${{ inputs.build_os }}" \
          --arg checksum "${{ inputs.checksum }}" \
          --arg build_sha "$BUILD_SHA" \
          --arg arch "${{ inputs.arch }}" \
          --arg version "${{ inputs.version }}" \
          --argjson production ${{ inputs.production }} \
          '{
            name: $name,
            run_id: $run_id,
            build_type: $build_type,
            mono: $mono,
            deploy_type: $deploy_type,
            branch: $branch,
            build_os: $build_os,
            checksum: $checksum,
            production: $production
          }
          + (if ($arch | length) > 0 then {arch: $arch} else {} end)
          + (if ($version | length) > 0 then {version: $version} else {} end)
          + (if ($build_sha | length) > 0 then {build_sha: $build_sha} else {} end)')

        should_retry_http() {
          local code="${1:-000}"
          case "$code" in
            000|408|429|500|502|503|504|520|521|522|523|524) return 0 ;;
          esac
          [ "$code" -ge 500 ] 2>/dev/null
        }

        MAX_ATTEMPTS=5
        SLEEP_SECS=2
        HTTP_CODE=""
        response=""
        curl_exit=0
        attempt=1
        while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
          RESP_FILE="${RUNNER_TEMP:-/tmp}/cerebro_started_response.json"
          set +e
          HTTP_CODE=$(curl -sS --retry 0 --connect-timeout 15 --max-time 30 \
            -o "$RESP_FILE" -w "%{http_code}" \
            -X POST "${{ inputs.cerebro_url }}/api/v1/enginebuilds" \
            -H "Content-Type: application/json" \
            -H "BLAZIUM_AUTH: ${{ inputs.cerebro_auth }}" \
            -d "$BODY")
          curl_exit=$?
          set -e
          if [ -z "$HTTP_CODE" ]; then
            HTTP_CODE=000
          fi
          response=$(cat "$RESP_FILE" 2>/dev/null || true)
          echo "Attempt $attempt/$MAX_ATTEMPTS HTTP $HTTP_CODE curl_exit=$curl_exit"
          echo "Response: $response"

          if [ "$curl_exit" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            if echo "$response" | jq -e '.success == true' >/dev/null 2>&1; then
              break
            fi
          fi

          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            break
          fi
          if [ "$curl_exit" -ne 0 ] || should_retry_http "$HTTP_CODE"; then
            echo "Retrying Cerebro start notify in ${SLEEP_SECS}s..."
            sleep "$SLEEP_SECS"
            SLEEP_SECS=$((SLEEP_SECS * 2))
            attempt=$((attempt + 1))
            continue
          fi
          break
        done

        echo "## Build (Started)" >> "$GITHUB_STEP_SUMMARY"
        echo "HTTP $HTTP_CODE" >> "$GITHUB_STEP_SUMMARY"
        echo "Response: $response" >> "$GITHUB_STEP_SUMMARY"
        echo "HTTP $HTTP_CODE"
        echo "Response: $response"

        if [ "$curl_exit" -ne 0 ] || [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
          log_err "Error: Cerebro update failed with HTTP $HTTP_CODE."
          exit 1
        fi

        if ! echo "$response" | jq -e '.success == true' >/dev/null 2>&1; then
          log_err "Error: Cerebro update failed."
          exit 1
        fi

        echo "Cerebro update was successful."
        echo "Cerebro update was successful." >> "$GITHUB_STEP_SUMMARY"
