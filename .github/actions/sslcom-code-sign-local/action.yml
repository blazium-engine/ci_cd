name: SSL.com code signer (local)
description: >
  Runs SSL.com CodeSignTool on Ubuntu without Docker (same behavior as bioblaze/sslcom-code-signer v5).
  Clones upstream v5 once per job (cached under RUNNER_TEMP) and executes entrypoint.sh on the host.

inputs:
  command:
    description: CodeSignTool command (e.g. sign)
    required: true
    default: "--version"
  username:
    description: SSL.com ESigner username
    required: false
  password:
    description: SSL.com ESigner password
    required: false
  credential_id:
    description: Credential ID
    required: false
  totp_secret:
    description: TOTP secret
    required: false
  program_name:
    description: Program name
    required: false
  file_path:
    description: Single file to sign
    required: false
  dir_path:
    description: Directory of files to sign (non-recursive, top-level only)
    required: false
  output_path:
    description: Output directory for signed artifacts
    required: false
  malware_block:
    description: Passed to CodeSignTool when not batch_sign
    required: false
    default: "false"
  environment_name:
    description: PROD uses production config; other values use demo properties
    required: false
    default: "PROD"
  override:
    description: Override flag for CodeSignTool
    required: false
    default: "false"
  clean_logs:
    description: Remove CodeSignTool logs after run
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up CodeSignTool (JDK + upstream v5)
      id: setup
      shell: bash
      run: bash "${{ github.action_path }}/setup.sh"

    - name: Run CodeSigner
      shell: bash
      working-directory: ${{ steps.setup.outputs.codesign_root }}
      env:
        CODE_SIGN_ROOT: ${{ steps.setup.outputs.codesign_root }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_CREDENTIAL_ID: ${{ inputs.credential_id }}
        INPUT_TOTP_SECRET: ${{ inputs.totp_secret }}
        INPUT_PROGRAM_NAME: ${{ inputs.program_name }}
        INPUT_FILE_PATH: ${{ inputs.file_path }}
        INPUT_DIR_PATH: ${{ inputs.dir_path }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_MALWARE_BLOCK: ${{ inputs.malware_block }}
        INPUT_OVERRIDE: ${{ inputs.override }}
        INPUT_CLEAN_LOGS: ${{ inputs.clean_logs }}
        INPUT_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
      run: bash "${{ github.action_path }}/entrypoint.sh"
