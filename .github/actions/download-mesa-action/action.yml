name: Download Mesa Libraries
description: Downloads and validates the Mesa/NIR libraries.

inputs:
  mesa_url_base:
    description: Base URL for the Mesa libraries.
    required: true
  mesa_folder:
    description: Directory to download and extract Mesa libraries.
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Mesa Folder
      shell: bash
      run: |
        mesa_folder="$(echo "${{ inputs.mesa_folder }}" | sed 's|\\|/|g')"
        mkdir -p "${{ inputs.mesa_folder }}"
        echo "Mesa folder created at: ${{ inputs.mesa_folder }}"
    
    - name: Download Mesa Libraries
      shell: bash
      run: |
        mesa_folder="$(echo "${{ inputs.mesa_folder }}" | sed 's|\\|/|g')"
        base_url="${{ inputs.mesa_url_base }}"

        files=(
          "mesa_arm64.zip:$base_url-arm64-release.zip"
          "mesa_x86_64.zip:$base_url-x86_64-release.zip"
          "mesa_x86_32.zip:$base_url-x86_32-release.zip"
        )

        pushd "$mesa_folder"
        for file in "${files[@]}"; do
          name=${file%%:*}
          url=${file#*:}
          echo "Downloading $name from $url..."
          curl -L -o "$name" "$url"
          if [ $? -ne 0 ]; then
            echo "Error: Failed to download $name." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          unzip -o "$name" && rm -f "$name"
        done
        popd

    - name: Validate Mesa Libraries
      shell: bash
      run: |
        mesa_folder="$(echo "${{ inputs.mesa_folder }}" | sed 's|\\|/|g')"
        if [ -z "$(ls -A $mesa_folder)" ]; then
          echo "Validation failed: Mesa folder is empty." >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        echo "Mesa libraries downloaded and validated successfully." >> $GITHUB_STEP_SUMMARY
        ls -la $mesa_folder >> $GITHUB_STEP_SUMMARY

    - name: Set normalized output
      id: set_normalized_output
      shell: bash
      run: |
        mesa_folder="$(echo "${{ inputs.mesa_folder }}" | sed 's|\\|/|g')"
        echo "mesa_folder=$mesa_folder" >> "$GITHUB_OUTPUT"
outputs:
  mesa_folder:
    description: Path to the Mesa libraries folder.
    value: ${{ steps.set_normalized_output.outputs.mesa_folder }}
