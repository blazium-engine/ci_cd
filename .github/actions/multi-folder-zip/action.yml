name: Rename and Zip Folders Action
description: Renames folders in input_dir, zips them, and places the zip files in output_dir.

inputs:
  input_dir:
    description: The directory containing the original folders.
    required: true
  output_dir:
    description: The directory where zip files will be placed.
    required: true
  names:
    description: A YAML array of directory names to check within input_dir.
    required: true
  filename_new:
    description: A YAML array of new folder names to rename the folders.
    required: true

outputs:
  zipped_files:
    description: A list of paths to the zipped files.
    value: ${{ steps.process_folders.outputs.zipped_files }}

runs:
  using: "composite"
  steps:
    - name: Validate Input Parameters
      id: validate_inputs
      shell: bash
      run: |
        echo "::group::Validating input parameters"

        INPUT_DIR="${{ inputs.input_dir }}"
        OUTPUT_DIR="${{ inputs.output_dir }}"
        NAMES=$(echo "${{ inputs.names }}" | awk NF)
        FILENAME_NEW=$(echo "${{ inputs.filename_new }}" | awk NF)

        # Create output directory if it doesn't exist
        if [ ! -d "$OUTPUT_DIR" ]; then
          echo "Creating output directory: $OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
        fi

        # Ensure the number of items in both arrays match
        LEN_NAMES=$(echo "$NAMES" | wc -l)
        LEN_NEW=$(echo "$FILENAME_NEW" | wc -l)
        if [ "$LEN_NAMES" -ne "$LEN_NEW" ]; then
          echo "::error file=action.yml,line=31,endLine=31,title=Array Mismatch::The input arrays 'names' and 'filename_new' must be the same length."
          echo "Input validation failed: Array length mismatch" >> $GITHUB_STEP_SUMMARY
          exit 2
        fi

        echo "Input parameters validated successfully." >> $GITHUB_STEP_SUMMARY
        echo "::endgroup::"

    - name: Process Folders
      id: process_folders
      shell: bash
      run: |
        echo "::group::Processing folders"

        INPUT_DIR="${{ inputs.input_dir }}"
        OUTPUT_DIR="${{ inputs.output_dir }}"
        NAMES=$(echo "${{ inputs.names }}" | awk NF)
        FILENAME_NEW=$(echo "${{ inputs.filename_new }}" | awk NF)

        echo "## Listing Input Directory Contents" >> $GITHUB_STEP_SUMMARY
        ls -la "$INPUT_DIR" >> $GITHUB_STEP_SUMMARY

        ZIPPED_FILES=()

        paste <(echo "$NAMES") <(echo "$FILENAME_NEW") | while IFS=$'\t' read -r OLD_FOLDER_NAME NEW_FOLDER_NAME; do
          OLD_FOLDER_PATH="$INPUT_DIR/$OLD_FOLDER_NAME"
          NEW_FOLDER_PATH="$INPUT_DIR/$NEW_FOLDER_NAME"

          if [ ! -d "$OLD_FOLDER_PATH" ]; then
            echo "::error file=$OLD_FOLDER_PATH,line=1,endLine=1,title=Missing Directory::$OLD_FOLDER_NAME does not exist in $INPUT_DIR"
            echo "Skipping missing directory: $OLD_FOLDER_PATH" >> $GITHUB_STEP_SUMMARY
            continue
          fi

          # Attempt to rename the folder
          mv "$OLD_FOLDER_PATH" "$NEW_FOLDER_PATH"
          if [ $? -ne 0 ]; then
            echo "::error file=$OLD_FOLDER_PATH,line=1,endLine=1,title=Rename Failed::Failed to rename $OLD_FOLDER_NAME to $NEW_FOLDER_NAME"
            echo "Failed to rename $OLD_FOLDER_PATH to $NEW_FOLDER_PATH" >> $GITHUB_STEP_SUMMARY
            continue
          fi
          echo "Renamed $OLD_FOLDER_PATH to $NEW_FOLDER_PATH" >> $GITHUB_STEP_SUMMARY

          # Attempt to zip the renamed folder
          ZIP_FILE="$OUTPUT_DIR/${NEW_FOLDER_NAME}.zip"
          CREATE_ZIP="${{ github.action_path }}/../../scripts/create_zip.sh"
          (cd "$NEW_FOLDER_PATH" && bash "$CREATE_ZIP" "$ZIP_FILE" .)
          if [ $? -eq 0 ]; then
            echo "Zipped $NEW_FOLDER_PATH to $ZIP_FILE" >> $GITHUB_STEP_SUMMARY
            ZIPPED_FILES+=("$ZIP_FILE")
            rm -rf "$NEW_FOLDER_PATH"
          else
            echo "::error file=$NEW_FOLDER_PATH,line=1,endLine=1,title=Zip Failed::Could not zip $NEW_FOLDER_PATH"
            echo "Failed to zip $NEW_FOLDER_PATH" >> $GITHUB_STEP_SUMMARY
          fi
        done

        echo "Zipped files: ${ZIPPED_FILES[@]}" >> $GITHUB_STEP_SUMMARY
        echo "zipped_files=$(echo "${ZIPPED_FILES[@]}" | jq -c -R 'split(" ")')" >> $GITHUB_OUTPUT

        echo "## Listing Output Directory Contents" >> $GITHUB_STEP_SUMMARY
        ls -la "$OUTPUT_DIR" >> $GITHUB_STEP_SUMMARY

        echo "::endgroup::"
