name: Deploy Editors to Platforms
on:
  workflow_call:
    inputs:
      build_sha:
        description: "Build commit SHA to use for this job"
        required: true
        type: string
      runner_id:
        description: "Runner ID of the Parent Runner"
        required: true
        type: string
      new_version:
        description: "New Version that'll be Deployed"
        required: true
        type: string
      monoglue-build:
        description: "Build Status for Monoglue"
        required: true
        type: string
      windows-build:
        description: "Build Status for Windows"
        required: true
        type: string
      macos-build:
        description: "Build Status for MacOS"
        required: true
        type: string
      linux-build:
        description: "Build Status for Linux"
        required: true
        type: string
      android-build:
        description: "Build Status for Android"
        required: true
        type: string
      release_url:
        description: "Release URL to upload files to the Release URL"
        required: true
        type: string

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: blazium-dev
  BASE_NAME: BlaziumEditor_v${{ inputs.new_version }}

concurrency:
  group: ci-${{github.actor}}-${{ github.event.client_payload.type || 'nightly' }}-editor-deploy
  cancel-in-progress: true

jobs:
  do-we-deploy-lol:
    name: Should we Deploy, to Platforms? 
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.evaluate.outputs.proceed }}
    steps:
      - name: Print Inputs and Initial Debugging
        run: |
          echo "Client Payload Force: ${{ github.event.client_payload.force }}"
          echo "Inputs:"
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}"
          echo "  - windows-build: ${{ inputs.windows-build }}"
          echo "  - macos-build: ${{ inputs.macos-build }}"
          echo "  - linux-build: ${{ inputs.linux-build }}"
          echo "  - android-build: ${{ inputs.android-build }}"
          echo "--- End of Inputs ---"

      - name: Are we Deploying?
        id: evaluate
        run: |
          echo "Evaluating Deployment Condition..."  >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event.client_payload.force }}" == "true" ]]; then
            echo "Force deploy is true. Proceeding."  >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.monoglue-build }}" == "success" && 
                  "${{ inputs.windows-build }}" == "success" && 
                  "${{ inputs.macos-build }}" == "success" && 
                  "${{ inputs.linux-build }}" == "success" && 
                  "${{ inputs.android-build }}" == "success" ]]; then
            echo "All builds succeeded. Proceeding."  >> $GITHUB_STEP_SUMMARY
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "Conditions not met. Skipping deploy."  >> $GITHUB_STEP_SUMMARY
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log Outputs to Step Summary
        run: |
          echo "### Debugging Outputs" >> $GITHUB_STEP_SUMMARY
          echo "Client Payload Force: ${{ github.event.client_payload.force }}" >> $GITHUB_STEP_SUMMARY
          echo "Inputs:" >> $GITHUB_STEP_SUMMARY
          echo "  - monoglue-build: ${{ inputs.monoglue-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - windows-build: ${{ inputs.windows-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - macos-build: ${{ inputs.macos-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - linux-build: ${{ inputs.linux-build }}" >> $GITHUB_STEP_SUMMARY
          echo "  - android-build: ${{ inputs.android-build }}" >> $GITHUB_STEP_SUMMARY
          echo "Proceed Output: ${{ steps.evaluate.outputs.proceed }}" >> $GITHUB_STEP_SUMMARY

      - name: Final Debug Output
        run: |
          echo "Proceed Output: ${{ steps.evaluate.outputs.proceed }}"
  
  web-deploy:
    name: Deploying Web Editor to ${{ github.event.client_payload.type || 'nightly' }}
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    runs-on: ubuntu-latest
    env:
      APP_NAME_BASE: "blazium_web-editor"  # Define a global base app name
      CDN_URL: "https://cdn.blazium.app/"
      DEPLOY_TYPE: web-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download and extract web editor package
        run: |
          # Create storage directory
          mkdir -p cicd/storage
          
          # Download the .tar.gz package instead of .zip
          curl -L "${{ env.CDN_URL }}${{ env.DEPLOY_TYPE }}/${{ github.event.client_payload.type || 'nightly' }}/${{ env.DEPLOY_TYPE }}-${{ github.event.client_payload.type || 'nightly' }}.tar.gz" -o cicd/storage/web-editor.tar.gz

          # Extract the main .tar.gz file
          tar -xzf cicd/storage/web-editor.tar.gz -C cicd/storage
          
          # Find the inner .zip file and unzip it
          inner_zip=$(find cicd/storage -type f -name 'blazium.web.editor.*.zip' | head -n 1)
          mkdir -p ./cicd/web-editor/static
          unzip "$inner_zip" -d ./cicd/web-editor/static
          
          # Rename the main HTML file
          mv ./cicd/web-editor/static/blazium.editor.html ./cicd/web-editor/static/index.html

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cicd/web-editor
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME_BASE }}-${{ github.event.client_payload.type || 'nightly' }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME_BASE }}-${{ github.event.client_payload.type || 'nightly' }}:${{ inputs.new_version }}

      - name: Notify Cerebro to Deploy Web Build
        uses: ./.github/actions/cerebro-deploy
        with:
          name: web-editor
          type: ${{ github.event.client_payload.type || 'nightly' }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
  
  deploy-mac-appstore:
    runs-on: "macos-latest"
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-engine/ci_cd
          submodules: recursive
      
      - name: Download Editor
        uses: ./.github/actions/cerebro-download-multi-build
        with:
          names: |
            macos-editor-${{ github.event.client_payload.type || 'nightly' }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          folder: ${{ github.workspace }}/downloads
      
      - name: Uncompress Templates
        uses: ./.github/actions/multi-uncompress-tar-gz
        with:
          names: |
            macos-editor-${{ github.event.client_payload.type || 'nightly' }}
          input_dir: ${{ github.workspace }}/downloads
          output_dir: ${{ github.workspace }}/extracted

      - name: Extract Blazium.
        working-directory: extracted/macos-editor-${{ github.event.client_payload.type || 'nightly' }}
        run: |
          ls
          unzip -o Blazium_macos.universal.zip
          ls
          # output should be Blazium.app
          mv Blazium.app ../Blazium.app

      # https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Install the Apple certificate and provisioning profile
        working-directory: extracted
        env:
          DEPLOY_CERTIFICATE_BASE64: ${{ secrets.DEPLOY_CERTIFICATE_BASE64 }}
          INSTALL_CERTIFICATE_BASE64: ${{ secrets.INSTALL_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEPLOY_PROVISION_PROFILE_MAC_BASE64: ${{ secrets.DEPLOY_PROVISION_PROFILE_MAC_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          DEPLOY_CERTIFICATE_PATH=$RUNNER_TEMP/deploy_certificate.p12
          INSTALL_CERTIFICATE_PATH=$RUNNER_TEMP/install_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$DEPLOY_CERTIFICATE_BASE64" | base64 --decode -o $DEPLOY_CERTIFICATE_PATH
          echo -n "$INSTALL_CERTIFICATE_BASE64" | base64 --decode -o $INSTALL_CERTIFICATE_PATH
          echo -n "$DEPLOY_PROVISION_PROFILE_MAC_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          # Import first certificate
          security import $DEPLOY_CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          SIGNING_IDENTITY=$(security find-identity -p basic -v | awk -F'"' 'NR==1 {print $2}')
          echo "DEPLOY_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          # Capture list of identities before second import
          IDENTITIES_BEFORE=$(security find-identity -p basic -v | awk -F'"' '{print $2}')

          # Import second certificate
          security import $INSTALL_CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -p basic -v
          # Capture list of identities after second import
          IDENTITIES_AFTER=$(security find-identity -p basic -v | awk -F'"' '{print $2}')

          # Find the new identity added (difference between after and before)
          SECOND_SIGNING_IDENTITY=$(comm -13 <(echo "$IDENTITIES_BEFORE" | sort) <(echo "$IDENTITIES_AFTER" | sort) | head -n 1)

          # Export to GitHub Actions environment
          echo "INSTALL_SIGNING_IDENTITY=$SECOND_SIGNING_IDENTITY" >> $GITHUB_ENV
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          cp $PP_PATH Blazium.app/Contents/embedded.provisionprofile
          # Set apple team id in entitlements
          sed -i '' -e "s/APPLE_TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" ../deploy/macos/deploy.entitlements
          plutil ../deploy/macos/deploy.entitlements
          cat ../deploy/macos/deploy.entitlements

      - name: Code Sign
        working-directory: extracted
        run: |
          # Remove wrong attributes, these could be quarantine attibutes.
          xattr -cr Blazium.app

          codesign --force --options=runtime --verbose --timestamp \
            --entitlements ../deploy/macos/deploy.entitlements --sign "$DEPLOY_SIGNING_IDENTITY" \
            Blazium.app
      
      - name: Make installer
        working-directory: extracted
        run: |
          productbuild --sign "$INSTALL_SIGNING_IDENTITY" \
          --component Blazium.app /Applications Blazium.pkg
      
      - name: Deploy installer
        working-directory: extracted
        run: |
          xcrun altool --upload-app --type osx --file Blazium.pkg \
          --username "${{ secrets.APPLE_ID }}" --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" --verbose

  deploy-steam:
    runs-on: ubuntu-latest
    needs: do-we-deploy-lol
    if: >
      needs.do-we-deploy-lol.outputs.proceed == 'true' ||
      needs.do-we-deploy-lol.outputs.proceed == true
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows Editors 64bit
            os: windows
            app_id: 3293450
            depot_id: 3293451
            folder: windows-editor-64bit-${{ github.event.client_payload.type || 'nightly' }}
            old_filenames: |
              blazium.windows.editor.x86_64.llvm.exe
              blazium.windows.editor.x86_64.llvm.console.exe
            new_filenames: |
              blazium.windows.editor.exe
              blazium.windows.editor.console.exe

          - name: MacOS Editors Universal
            os: macos
            app_id: 3293450
            depot_id: 3293453
            folder: macos-editor-${{ github.event.client_payload.type || 'nightly' }}
            old_filenames: |
              Blazium_macos.universal.zip
            new_filenames: |
              Blazium_macos.universal.zip

          - name: Linux Editors 64bit
            os: linux
            app_id: 3293450
            depot_id: 3293452
            folder: linux-editor-64bit-${{ github.event.client_payload.type || 'nightly' }}
            old_filenames: |
              blazium.linuxbsd.editor.x86_64
            new_filenames: |
              blazium.linux.editor

          - name: Windows Editors 32bit
            os: windows
            app_id: 3293450
            depot_id: 3293451
            folder: windows-editor-32bit-${{ github.event.client_payload.type || 'nightly' }}
            old_filenames: |
              blazium.windows.editor.x86_32.llvm.exe
              blazium.windows.editor.x86_32.llvm.console.exe
            new_filenames: |
              blazium.windows.editor.exe
              blazium.windows.editor.console.exe

          - name: Linux Editors 32bit
            os: linux
            app_id: 3293450
            depot_id: 3293452
            folder: linux-editor-32bit-${{ github.event.client_payload.type || 'nightly' }}
            old_filenames: |
              blazium.linuxbsd.editor.x86_32
            new_filenames: |
              blazium.linux.editor

        exclude:
          - config:
              skip: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: blazium-engine/ci_cd
          submodules: recursive

      - name: Download All Template Files
        uses: ./.github/actions/cerebro-download-multi-build
        with:
          names: |
            ${{ matrix.config.folder }}
          run_id: ${{ inputs.runner_id }}
          cerebro_url: ${{ secrets.CEREBRO_URL }}
          cerebro_auth: ${{ secrets.BLAZIUM_AUTH }}
          folder: ${{ github.workspace }}/downloads

      - name: Uncompress Templates
        uses: ./.github/actions/multi-uncompress-tar-gz
        with:
          names: |
            ${{ matrix.config.folder }}
          input_dir: ${{ github.workspace }}/downloads
          output_dir: ${{ github.workspace }}/extracted


      - name: Edit Editor Filenames in-Place
        uses: ./.github/actions/multi-rename-inplace
        with:
          names: |
            ${{ matrix.config.folder }}
          filename_old: |
            ${{ join(matrix.config.old_filenames, '\n') }}
          filename_new: |
            ${{ join(matrix.config.new_filenames, '\n') }}
          input_dir: ${{ github.workspace }}/extracted

      - name: Delete Editor Filenames/Folders in-Place
        uses: ./.github/actions/multi-delete-inplace
        with:
          names: |
            ${{ matrix.config.folder }}
          input_dir: ${{ github.workspace }}/extracted
          items_to_delete: |
            build_deps/

      - uses: bioblaze/deploy2steam@v2
        with:
          username: ${{ secrets.STEAM_USERNAME }}     
          password: ${{ secrets.STEAM_PASSWORD }}
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}
          appId: ${{ matrix.config.app_id }}
          buildDescription: ${{ inputs.new_version }}
          rootPath: ${{ github.workspace }}/extracted/
          depotId: ${{ matrix.config.depot_id }}
          depotPath: ${{ matrix.config.folder }}
